<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar Anúncio')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header(${user})}"></header>
    
    <main>
        <div class="form-container">
            <h1 class="page-title">Criar Anúncio</h1>
            
            <!-- Error Message from API -->
            <div th:if="${apiError}" class="alert alert-error" th:text="${apiError}"></div>
            
            <!-- Ad create form -->
            <form th:action="@{/ads/create}" 
                  th:object="${adForm}" 
                  method="post"
                  novalidate>
                
                <div class="form-group">
                    <label for="type" class="form-label required">Tipo de Anúncio</label>
                    <select id="type" 
                            th:field="*{type}" 
                            class="form-control"
                            th:classappend="${#fields.hasErrors('type')} ? 'error' : ''"
                            required>
                        <option value="">Selecione...</option>
                        <option value="OFFER">Oferta de Quarto</option>
                        <option value="SEARCH">Procura de Quarto</option>
                    </select>
                    <span th:if="${#fields.hasErrors('type')}" 
                          th:errors="*{type}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="roomType" class="form-label required">Tipo de Quarto</label>
                    <input type="text" 
                           id="roomType" 
                           th:field="*{roomType}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('roomType')} ? 'error' : ''"
                           placeholder="Ex: T1, T2, T3..."
                           required>
                    <span th:if="${#fields.hasErrors('roomType')}" 
                          th:errors="*{roomType}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="location" class="form-label required">Localização</label>
                    <input type="text" 
                           id="location" 
                           th:field="*{location}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('location')} ? 'error' : ''"
                           placeholder="Ex: Évora, Lisboa, Centro Histórico..."
                           required
                           maxlength="200">
                    <span th:if="${#fields.hasErrors('location')}" 
                          th:errors="*{location}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="price" class="form-label required">Preço (€/mês)</label>
                    <input type="number" 
                           id="price" 
                           th:field="*{price}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('price')} ? 'error' : ''"
                           placeholder="Ex: 250.00"
                           step="0.01"
                           min="0.01"
                           required>
                    <span th:if="${#fields.hasErrors('price')}" 
                          th:errors="*{price}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="gender" class="form-label required">Género Preferido</label>
                    <select id="gender" 
                            th:field="*{gender}" 
                            class="form-control"
                            th:classappend="${#fields.hasErrors('gender')} ? 'error' : ''"
                            required>
                        <option value="">Selecione...</option>
                        <option value="MALE">Masculino</option>
                        <option value="FEMALE">Feminino</option>
                        <option value="INDIFFERENT">Indiferente</option>
                    </select>
                    <span th:if="${#fields.hasErrors('gender')}" 
                          th:errors="*{gender}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="contact" class="form-label required">Contacto</label>
                    <input type="text" 
                           id="contact" 
                           th:field="*{contact}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('contact')} ? 'error' : ''"
                           placeholder="Email ou telefone"
                           required
                           maxlength="100">
                    <span th:if="${#fields.hasErrors('contact')}" 
                          th:errors="*{contact}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="description" class="form-label required">Descrição</label>
                    <textarea id="description" 
                              th:field="*{description}" 
                              class="form-control"
                              th:classappend="${#fields.hasErrors('description')} ? 'error' : ''"
                              rows="6"
                              placeholder="Descrição do quarto..."
                              required
                              minlength="10"
                              maxlength="1000"></textarea>
                    <span th:if="${#fields.hasErrors('description')}" 
                          th:errors="*{description}" 
                          class="error-message"></span>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Criar Anúncio</button>
                <a th:href="@{/}" class="btn btn-secondary btn-block">Cancelar</a>
            </form>
        </div>
    </main>
    
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
