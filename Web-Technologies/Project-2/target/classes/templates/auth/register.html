<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registar')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header(null)}"></header>
    
    <main>
        <div class="form-container">
            <h1 class="page-title">Registar</h1>
            
            <!-- Success Message -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            
            <form th:action="@{/register}" 
                  th:object="${registerForm}" 
                  method="post" 
                  novalidate>
                
                <div class="form-group">
                    <label for="username" class="form-label required">Username</label>
                    <input type="text" 
                           id="username" 
                           th:field="*{username}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'error' : ''"
                           required 
                           minlength="3" 
                           maxlength="20"
                           autofocus>
                    <span th:if="${#fields.hasErrors('username')}" 
                          th:errors="*{username}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="name" class="form-label required">Nome</label>
                    <input type="text" 
                           id="name" 
                           th:field="*{name}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"
                           required>
                    <span th:if="${#fields.hasErrors('name')}" 
                          th:errors="*{name}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label required">Email</label>
                    <input type="email" 
                           id="email" 
                           th:field="*{email}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"
                           required>
                    <span th:if="${#fields.hasErrors('email')}" 
                          th:errors="*{email}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label required">Password</label>
                    <input type="password" 
                           id="password" 
                           th:field="*{password}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'error' : ''"
                           required 
                           minlength="6">
                    <span th:if="${#fields.hasErrors('password')}" 
                          th:errors="*{password}" 
                          class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="confirmationPassword" class="form-label required">Confirmar Password</label>
                    <input type="password" 
                           id="confirmationPassword" 
                           th:field="*{confirmationPassword}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('confirmationPassword')} ? 'error' : ''"
                           required 
                           minlength="6">
                    <span th:if="${#fields.hasErrors('confirmationPassword')}" 
                          th:errors="*{confirmationPassword}" 
                          class="error-message"></span>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Registar</button>
                
                <p class="text-center add-margin-top">
                    Já tem conta? <a th:href="@{/login}">Login</a>
                </p>
            </form>
        </div>
    </main>
    
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
